name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue runs instead of cancelling them so every commit gets a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # setup-android sets ANDROID_SDK_ROOT; AGP accepts either variable.
      - name: Expose Android SDK path to Gradle
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/feedbil-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/feedbil-signing/release.jks"

      # Fails here with a clear message if the store password or key password
      # does not match the decoded file, instead of surfacing later in Gradle.
      - name: Inspect signing keystore
        env:
          FEEDBIL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          FEEDBIL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/feedbil-signing/release.jks"
          keytool -list -keystore "$KEYSTORE" -storepass "$FEEDBIL_RELEASE_STORE_PASSWORD"
          keytool -certreq -alias "$FEEDBIL_RELEASE_KEY_ALIAS" -keystore "$KEYSTORE" \
            -storepass "$FEEDBIL_RELEASE_STORE_PASSWORD" \
            -keypass "$FEEDBIL_RELEASE_STORE_PASSWORD" \
            -file "$RUNNER_TEMP/feedbil-signing/diagnostic.csr"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -Pandroid.builder.sdkDownload=true

      - name: Build signed release APK
        env:
          FEEDBIL_RELEASE_STORE_FILE: ${{ runner.temp }}/feedbil-signing/release.jks
          FEEDBIL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          FEEDBIL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # PKCS12 encrypts the key with the store password; no duplicate secret.
          FEEDBIL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.builder.sdkDownload=true \
            -Pfeedbil.versionCode=${{ github.run_number }} \
            -Pfeedbil.versionName=1.0.${{ github.run_number }}

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "feedbil-${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Feedbil build ${{ github.run_number }}
          body: |
            Automated development build from commit ${{ github.sha }}.

            Signed with the project's release key. Download the APK below to
            install it directly on an Android 8.0+ device.
          prerelease: true
          files: feedbil-${{ github.run_number }}.apk

      - name: Remove signing keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/feedbil-signing"
