name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit's result matters; cancel superseded runs.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # setup-android sets ANDROID_SDK_ROOT; AGP accepts either variable.
      - name: Expose Android SDK path to Gradle
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -Pandroid.builder.sdkDownload=true
